name: CD Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deployment-gate-checks:
    name: Promotion evidence + migration gate (seeded fault tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run gate checks
        run: node --test platform/deployment/checks/gates.test.mjs
